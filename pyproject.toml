[project]
name = "streamo"
version = "0.1.0"
description = "Stream a stereo audio device pair to live ingest services."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pillow>=12.3.0",
    "pydantic>=2",
    "reccy",
    "sounddevice",
    "strenum",
    "tomli>=2",
    "tyro",
]

[project.scripts]
streamo = "streamo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
reccy = { git = "https://github.com/rec/reccy.git", branch = "main" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
