[streaming_service]
service = "custom"
name = "Venue CDN"

[streaming_service.ingest]
protocol = "rtmps"
server_url = "rtmps://ingest.example.com/live"
stream_key = "replace-with-stream-key"

[streaming_service.encoding]
container = "flv"

[streaming_service.encoding.audio]
codec = "aac"
bitrate = "160k"
